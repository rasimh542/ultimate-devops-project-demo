# CI for Product Catalog Service - Build and Push

name: build-and-push

on: 
    pull_request:
        branches:
        - main
        # 👇 Add this block to ignore changes to all workflow files
        paths-ignore:
          - '.github/workflows/**'
    
    workflow_dispatch:

permissions:
    id-token: write
    contents: write
    
jobs:

    build:
        runs-on: ubuntu-latest

        steps:
        - name: checkout code
          uses: actions/checkout@v4

        - name: Setup Go 1.22
          uses: actions/setup-go@v5
          with:
            go-version: 1.22
            
        - name: Generate and Save Tag
          run: |
            # Combines the fixed version prefix with the timestamp
            TAG="v1.0_$(date +'%Y%m%d%H%M%S')"
            echo "$TAG" > release-tag.txt
            echo "Generated Tag: $TAG"
        
        - name: Build
          run: |
            cd src/product-catalog
            go mod download
            go build -o product-catalog-service main.go

        - name: unit tests
          run: |
            cd src/product-catalog
            go test ./...

        - name: Upload Tag Artifact
          uses: actions/upload-artifact@v4
          with:
              name: release-tag
              path: release-tag.txt
              retention-days: 90
    
    code-quality:
        runs-on: ubuntu-latest

        steps:
        - name: checkout code
          uses: actions/checkout@v4
        
        - name: Setup Go 1.22
          uses: actions/setup-go@v5
          with:
           go-version: 1.22
        
        - name: Run golangci-lint
          uses: golangci/golangci-lint-action@v6
          with:
            version: v1.55.2
            run: golangci-lint run
            working-directory: src/product-catalog

    docker:
      runs-on: ubuntu-latest
      needs: [build, code-quality]
      steps:
        - name: checkout code
          uses: actions/checkout@v4

        - name: Download Tag Artifact
          uses: actions/download-artifact@v4
          with:
            name: release-tag

        - name: Read Tag into Environment Variable
          id: get_tag
          run: |
            TAG_VALUE=$(cat release-tag.txt | tr -d '\n')
            echo "IMAGE_TAG=$TAG_VALUE" >> $GITHUB_ENV

        - name: Install Docker
          uses: docker/setup-buildx-action@v3
        
        - name: Login to Docker
          uses: docker/login-action@v3
          with:
            username: ${{ secrets.DOCKER_USERNAME }}
            password: ${{ secrets.DOCKER_TOKEN }}

        - name: Docker Push
          uses: docker/build-push-action@v6
          with:
            context: src/product-catalog
            file: src/product-catalog/Dockerfile
            push: true
            tags: ${{ secrets.DOCKER_USERNAME }}/product-catalog:${{ env.IMAGE_TAG }}
